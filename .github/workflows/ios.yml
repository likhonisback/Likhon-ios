
name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          test -f index.html

      - name: Prepare web app
        run: |
          mkdir -p output
          cp index.html output/index.html
          cd output
          zip -r ../ios-web-app.zip .

      - name: Upload web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-files
          path: ios-web-app.zip
